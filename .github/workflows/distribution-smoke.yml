name: Distribution smoke

# Proves real Packagist create-project for the corrected release (>= v0.1.1):
# modules:false + direct mithrilphp ^2.2 + doctor + optimize.
# Skips only while Packagist still lacks v0.1.1+.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution-smoke:
    name: Packagist create-project smoke
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, pdo, pdo_sqlite, sockets, msgpack
          coverage: none
          tools: composer:v2

      - name: Resolve Packagist >= 0.1.1
        id: packagist
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/durin-app-packagist.json -w "%{http_code}" \
            https://repo.packagist.org/p2/ereborcodeforge/durin-app.json || echo 000)
          echo "Packagist HTTP status: ${code}"
          if [ "${code}" != "200" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ereborcodeforge/durin-app not on Packagist yet — skip distribution smoke."
            exit 0
          fi

          version=$(php -r '
            $j = json_decode((string) file_get_contents("/tmp/durin-app-packagist.json"), true, 512, JSON_THROW_ON_ERROR);
            $best = null;
            foreach ($j["packages"]["ereborcodeforge/durin-app"] ?? [] as $pkg) {
              $raw = ltrim((string) ($pkg["version"] ?? ""), "v");
              if ($raw === "" || version_compare($raw, "0.1.1", "<")) {
                continue;
              }
              $mithril = $pkg["require"]["ereborcodeforge/mithrilphp"] ?? null;
              if ($mithril !== "^2.2") {
                continue;
              }
              if ($best === null || version_compare($raw, $best, ">")) {
                $best = $raw;
              }
            }
            if ($best !== null) {
              echo $best;
            }
          ')

          if [ -z "${version}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Packagist has no durin-app >= 0.1.1 with mithrilphp ^2.2 yet — skip until v0.1.1 syncs."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved Packagist version >= 0.1.1: ${version}"

      - name: Fresh create-project from Packagist
        if: steps.packagist.outputs.available == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          mkdir smoke-root
          cd smoke-root

          composer create-project \
            ereborcodeforge/durin-app:^0.1 \
            smoke-app \
            --no-interaction \
            --prefer-dist

          cd smoke-app

          test -f composer.json
          test -f durin.yaml
          test -f src/Kernel.php
          test -x vendor/bin/durin

          php -r '
            $json = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            if (!empty($json["repositories"])) {
              fwrite(STDERR, "custom repositories must not exist\n");
              exit(1);
            }
            $mithril = $json["require"]["ereborcodeforge/mithrilphp"] ?? null;
            if ($mithril !== "^2.2") {
              fwrite(STDERR, "expected mithrilphp ^2.2, got: " . var_export($mithril, true) . "\n");
              exit(1);
            }
            echo "composer contract ok\n";
          '

          grep -q 'modules: false' durin.yaml

          # Prove ^0.1 resolved to the corrected release, not stale v0.1.0.
          php -r '
            $out = [];
            $code = 0;
            exec("composer show ereborcodeforge/durin-app --format=json 2>/dev/null", $out, $code);
            $joined = implode("\n", $out);
            if ($code === 0 && $joined !== "") {
              $data = json_decode($joined, true);
              $ver = ltrim((string) ($data["versions"][0] ?? $data["version"] ?? ""), "v");
              if ($ver !== "" && version_compare($ver, "0.1.1", "<")) {
                fwrite(STDERR, "create-project resolved stale version: {$ver}\n");
                exit(1);
              }
              if ($ver !== "") {
                echo "installed package version: {$ver}\n";
              }
            }
            // Content contract is authoritative for project roots.
            $require = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR)["require"] ?? [];
            if (($require["ereborcodeforge/mithrilphp"] ?? null) !== "^2.2") {
              fwrite(STDERR, "root composer.json missing hardened mithril require\n");
              exit(1);
            }
            echo "hardened content contract ok\n";
          '

          vendor/bin/durin doctor
          vendor/bin/durin optimize

          test -n "$(find var/cache -type f ! -name .gitkeep | head -1)"
