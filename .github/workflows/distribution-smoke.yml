name: Distribution smoke

# Proves Packagist create-project for the neutral root + durin init path
# for minimal, service, and worker presets (post-init assertions).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution-smoke:
    name: Packagist create-project (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [minimal, service, worker]

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, pdo, pdo_sqlite, sockets, msgpack
          coverage: none
          tools: composer:v2

      - name: Resolve Packagist >= 0.2.0
        id: packagist
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/durin-app-packagist.json -w "%{http_code}" \
            https://repo.packagist.org/p2/ereborcodeforge/durin-app.json || echo 000)
          echo "Packagist HTTP status: ${code}"
          if [ "${code}" != "200" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ereborcodeforge/durin-app not on Packagist yet — skip distribution smoke."
            exit 0
          fi

          version=$(php -r '
            $j = json_decode((string) file_get_contents("/tmp/durin-app-packagist.json"), true, 512, JSON_THROW_ON_ERROR);
            $best = null;
            foreach ($j["packages"]["ereborcodeforge/durin-app"] ?? [] as $pkg) {
              $raw = ltrim((string) ($pkg["version"] ?? ""), "v");
              if ($raw === "" || version_compare($raw, "0.2.0", "<")) {
                continue;
              }
              if ($best === null || version_compare($raw, $best, ">")) {
                $best = $raw;
              }
            }
            if ($best !== null) {
              echo $best;
            }
          ')

          if [ -z "${version}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Packagist has no durin-app >= 0.2.0 yet — skip until sync."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved Packagist version >= 0.2.0: ${version}"

      - name: Fresh create-project from Packagist
        if: steps.packagist.outputs.available == 'true'
        working-directory: ${{ runner.temp }}
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail

          mkdir -p smoke-root
          cd smoke-root

          composer create-project \
            ereborcodeforge/durin-app:^0.2 \
            "smoke-${PRESET}" \
            --no-interaction \
            --prefer-dist

          cd "smoke-${PRESET}"

          test -f composer.json
          test -f durin.yaml
          test ! -f src/Kernel.php
          test ! -d routes
          test ! -d public
          test -x vendor/bin/durin

          grep -q 'preset: uninitialized' durin.yaml
          grep -q 'state: unresolved' durin.yaml
          ! grep -q '"mithril"' composer.json || ! grep -q '"kernel"' composer.json

          vendor/bin/durin init --preset="${PRESET}" --skip-runtime-install
          grep -q "preset: ${PRESET}" durin.yaml

          if [ "${PRESET}" = "worker" ]; then
            test -f src/JobKernel.php
            test ! -f src/Kernel.php
            test ! -d routes
            test ! -d public
            grep -q 'execution: mithril-job' durin.yaml
            ! grep -q 'supervisor:' durin.yaml
            ! grep -q '"eregion"' composer.json
          else
            test -f src/Kernel.php
            test -f routes/web.php
            test -f public/index.php
            test ! -f src/JobKernel.php
            grep -q 'execution: mithril-http' durin.yaml
            grep -q 'supervisor: eregion' durin.yaml
            grep -q 'APP_URL=' .env.example
            grep -q '"kernel"' composer.json
          fi

          vendor/bin/durin doctor
